<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anna Carreras — índice (prototipo A)</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="base.css">
<style>
  /* PROTOTIPO A — índice tipográfico.
     De v3ga.net: una sola página, orden inverso, el tipo de pieza como etiqueta.
     De annalucia.io: la tripleta título / año / formato y ninguna imagen en el
     listado. La portada solo aparece al pasar el ratón, así 103 proyectos
     caben sin convertirse en un muro de miniaturas. */
  :root {
    --bg: #fff; --fg: #111; --dim: #949494; --rule: #e6e6e6; --accent: #d8412f;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d0d0d; --fg: #f2f0ed; --dim: #6f6f6f; --rule: #232323; --accent: #ff6a4d; }
  }
  header.site {
    position: sticky; top: 0; z-index: 3; background: var(--bg);
    display: flex; flex-wrap: wrap; gap: .4rem 1.5rem; align-items: baseline;
    padding: 1.1rem 1.5rem; border-bottom: 1px solid var(--rule);
  }
  header.site h1 { margin: 0; font-size: 1rem; font-weight: 600; letter-spacing: -.01em; }
  header.site .tag, header.site nav { font: 400 .78rem/1 var(--mono); color: var(--dim); letter-spacing: .02em; }
  header.site nav { margin-left: auto; display: flex; gap: 1rem; }
  header.site nav a[aria-current], header.site nav a:hover { color: var(--accent); }

  .list { padding: 0 1.5rem 8rem; }
  .decade {
    position: sticky; top: 3.45rem; z-index: 2; background: var(--bg);
    margin: 0; padding: 2.75rem 0 .4rem; border-bottom: 1px solid var(--rule);
    font: 400 .78rem/1 var(--mono); color: var(--dim); letter-spacing: .08em;
  }
  .row {
    display: grid; grid-template-columns: 4.5rem 1fr auto; gap: 1.5rem; align-items: baseline;
    padding: .5rem 0; border-bottom: 1px solid var(--rule);
  }
  .row .year { font: 400 .78rem/1.7 var(--mono); color: var(--dim); }
  .row .title { font-size: 1.3rem; font-weight: 400; letter-spacing: -.015em; line-height: 1.25; }
  .row .kind { font: 400 .72rem/1.9 var(--mono); color: var(--dim); letter-spacing: .04em; text-align: right; }
  .list:hover .row:not(:hover) .title { color: var(--dim); }
  .row .title { transition: color .2s; }
  .row:hover .title { color: var(--accent); }

  #peek { position: fixed; right: 1.5rem; top: 5.5rem; width: min(38vw, 30rem); z-index: 1; opacity: 0; transition: opacity .18s; pointer-events: none; }
  #peek img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: var(--rule); }
  #peek.on { opacity: 1; }
  /* el preview vive en la mitad derecha, así que el listado se reserva la
     izquierda; por debajo de 1100px no hay sitio y no se enseña */
  @media (min-width: 1100px) { .list { max-width: 58rem; } }
  @media (max-width: 1099px) { #peek { display: none; } }
  @media (max-width: 820px) {
    .row { grid-template-columns: 3.2rem 1fr; }
    .row .kind { display: none; }
  }
</style>
</head>
<body>

<header class="site" data-nav>
  <h1>Anna Carreras</h1>
  <span class="tag">generative art &amp;&amp; interactive installations</span>
  <nav>
    <a href="#/">Work</a>
    <a href="#/about">About</a>
  </nav>
</header>

<main id="app"></main>
<div id="peek"><img alt=""></div>

<nav class="protobar">
  <a href="a-index.html" aria-current="page">A · índice</a>
  <a href="b-grid.html">B · grid</a>
  <a href="c-canvas.html">C · canvas</a>
  <a href="index.html">prototipos</a>
</nav>

<script type="module">
import { get, el, router } from './proto.js';

const app = document.getElementById('app');
const peek = document.getElementById('peek');
const peekImg = peek.querySelector('img');
const decade = (y) => String(y).slice(0, 3) + '0s';

function renderList(index) {
  document.title = 'Anna Carreras — work';
  const list = el('div');
  list.className = 'list';
  let current = null;
  index.forEach((p) => {
    const d = decade(p.year);
    if (d !== current) {
      current = d;
      const n = index.filter((x) => decade(x.year) === d).length;
      const h = el('h2', d + '<span style="float:right">' + n + '</span>');
      h.className = 'decade';
      list.append(h);
    }
    const a = el('a');
    a.className = 'row';
    a.href = (p.local ? '#/p/' : '#/x/') + p.slug;
    const year = el('span', p.year + (p.year_guessed ? '?' : ''));
    year.className = 'year';
    const title = el('span', p.title);
    title.className = 'title';
    const kind = el('span', p.categories.join(' / '));
    kind.className = 'kind';
    a.append(year, title, kind);
    a.addEventListener('pointerenter', () => {
      if (!p.cover) return;
      peekImg.src = p.cover.src;
      peek.classList.add('on');
    });
    a.addEventListener('pointerleave', () => peek.classList.remove('on'));
    list.append(a);
  });
  return list;
}

addEventListener('hashchange', () => peek.classList.remove('on'));
router(app, renderList);
</script>
</body>
</html>
