<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anna Carreras — canvas (prototipo C)</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="base.css">
<style>
  /* PROTOTIPO C — home generativa.
     El sistema que se dibuja arriba son Truchet tiles multiescala, el mismo
     homenaje que hay detrás de «Trossets»: doce bloques que se combinan sin
     repetirse. La idea es que la portada no explique su trabajo, lo ejecute.
     Debajo, el índice completo en texto, porque 103 proyectos no caben en una
     pantalla y el canvas no puede ser el único modo de llegar a ellos. */
  :root {
    --bg: #0b0b0c; --fg: #ececea; --dim: #6a6a68; --rule: #202022; --accent: #ff4d2e;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    --sans: var(--mono);
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f2ee; --fg: #13130f; --dim: #8d8d86; --rule: #e0ded7; --accent: #e0341a; }
  }
  body { font-family: var(--mono); }

  .hero { position: relative; height: 100svh; min-height: 30rem; overflow: hidden; border-bottom: 1px solid var(--rule); }
  .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hero .over {
    position: relative; z-index: 1; height: 100%;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 1.5rem; pointer-events: none;
    /* el patrón se apaga arriba y abajo para que el texto se lea sin caja */
    background: linear-gradient(to bottom, var(--bg), transparent 22%, transparent 78%, var(--bg));
  }
  .hero .over > * { pointer-events: auto; }
  .hero h1 { margin: 0; font-size: .82rem; font-weight: 400; letter-spacing: .04em; }
  .hero .tag { font-size: .82rem; color: var(--dim); }
  .hero .bottom { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; align-items: baseline; font-size: .78rem; }
  .hero .bottom a, .hero .bottom button {
    font: inherit; color: var(--dim); background: none; border: 0; padding: 0; cursor: pointer; letter-spacing: .04em;
  }
  .hero .bottom a:hover, .hero .bottom button:hover, .hero .bottom a[aria-current] { color: var(--accent); }
  .hero .scroll { margin-left: auto; color: var(--dim); }

  .index { padding: 4rem 1.5rem 8rem; }
  .index .head { display: flex; justify-content: space-between; font-size: .78rem; color: var(--dim); letter-spacing: .06em; border-bottom: 1px solid var(--rule); padding-bottom: .5rem; }
  .cols { columns: 2 22rem; column-gap: 3rem; margin-top: 1.5rem; }
  .decade { break-inside: avoid; margin: 0 0 .4rem; padding-top: 1.5rem; font-size: .74rem; font-weight: 400; color: var(--dim); letter-spacing: .08em; }
  .row { display: grid; grid-template-columns: 3.6rem 1fr; gap: .75rem; padding: .28rem 0; font-size: .86rem; line-height: 1.35; break-inside: avoid; }
  .row .year { color: var(--dim); font-size: .74rem; line-height: 1.6; }
  .row:hover { color: var(--accent); }
  .row[data-pending] .year::after { content: "·"; margin-left: .15rem; }
</style>
</head>
<body>

<section class="hero">
  <canvas id="sketch"></canvas>
  <div class="over" data-nav>
    <div>
      <h1>Anna Carreras</h1>
      <span class="tag">generative art &amp;&amp; interactive installations</span>
    </div>
    <div class="bottom">
      <a href="#/">Work</a>
      <a href="#/about">About</a>
      <button id="again">regenerate ↻</button>
      <span class="scroll">103 projects ↓</span>
    </div>
  </div>
</section>

<main id="app"></main>

<nav class="protobar">
  <a href="a-index.html">A · índice</a>
  <a href="b-grid.html">B · grid</a>
  <a href="c-canvas.html" aria-current="page">C · canvas</a>
  <a href="index.html">prototipos</a>
</nav>

<script type="module">
import { el, router } from './proto.js';

/* ---------------------------------------------------------- el sistema ---
   Truchet multiescala: se subdivide la retícula recursivamente y cada celda
   dibuja dos cuartos de círculo en una de las dos orientaciones. Las celdas
   se pintan unas cuantas por frame, así el dibujo se ve construirse sin
   bloquear la página. */
const canvas = document.getElementById('sketch');
const ctx = canvas.getContext('2d');
// ?still pinta de golpe: útil para capturas y para ver el resultado final
const still = matchMedia('(prefers-reduced-motion: reduce)').matches || location.search.includes('still');
let cells = [], raf = 0;

const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function subdivide(x, y, s, depth, out) {
  if (depth > 0 && Math.random() < 0.55) {
    const h = s / 2;
    subdivide(x, y, h, depth - 1, out);
    subdivide(x + h, y, h, depth - 1, out);
    subdivide(x, y + h, h, depth - 1, out);
    subdivide(x + h, y + h, h, depth - 1, out);
    return;
  }
  out.push({ x, y, s, flip: Math.random() < 0.5, hot: Math.random() < 0.07 });
}

function draw(c) {
  const r = c.s / 2;
  ctx.lineWidth = Math.max(1.5, c.s / 7);
  ctx.lineCap = 'butt';
  ctx.strokeStyle = c.hot ? css('--accent') : css('--fg');
  ctx.globalAlpha = c.hot ? 0.85 : 0.3;
  const a = c.flip ? [[c.x, c.y], [c.x + c.s, c.y + c.s]] : [[c.x + c.s, c.y], [c.x, c.y + c.s]];
  a.forEach(([cx, cy]) => { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke(); });
}

function generate() {
  cancelAnimationFrame(raf);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  // recorta cada celda a su cuadrado: los arcos no se salen del bloque
  const base = Math.max(56, Math.min(w, h) / 9);
  const cols = Math.ceil(w / base), rows = Math.ceil(h / base);
  cells = [];
  for (let i = 0; i < cols; i++)
    for (let j = 0; j < rows; j++)
      subdivide(i * base, j * base, base, 2, cells);
  cells.sort(() => Math.random() - 0.5);

  if (still) { cells.forEach(clip); cells = []; return; }
  // rAF ya se pausa solo cuando la pestaña no está visible y retoma al volver
  let i = 0;
  const step = () => {
    for (let n = 0; n < 22 && i < cells.length; n++, i++) clip(cells[i]);
    if (i < cells.length) raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

function clip(c) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(c.x, c.y, c.s, c.s);
  ctx.clip();
  draw(c);
  ctx.restore();
}

document.getElementById('again').onclick = generate;
let t = 0;
addEventListener('resize', () => { clearTimeout(t); t = setTimeout(generate, 200); });
generate();

/* ------------------------------------------------------------- índice --- */
const app = document.getElementById('app');
const hero = document.querySelector('.hero');
const decade = (y) => String(y).slice(0, 3) + '0s';

function renderList(index) {
  document.title = 'Anna Carreras — work';
  hero.hidden = false;
  const box = el('div');
  box.className = 'index';
  const head = el('div', '<span>all projects</span><span>2001 — 2025</span>');
  head.className = 'head';
  const cols = el('div');
  cols.className = 'cols';
  let current = null;
  index.forEach((p) => {
    const d = decade(p.year);
    if (d !== current) {
      current = d;
      const h = el('h2', d);
      h.className = 'decade';
      cols.append(h);
    }
    const a = el('a');
    a.className = 'row';
    a.href = (p.local ? '#/p/' : '#/x/') + p.slug;
    if (!p.local) a.dataset.pending = '';
    const y = el('span', p.year + (p.year_guessed ? '?' : ''));
    y.className = 'year';
    a.append(y, el('span', p.title));
    cols.append(a);
  });
  box.append(head, cols);
  return box;
}

// El canvas solo manda en la home: en detalle y about estorba.
const onlyHome = () => { hero.hidden = (location.hash.slice(1) || '/') !== '/'; };
addEventListener('hashchange', onlyHome);
onlyHome();
router(app, renderList);
</script>
</body>
</html>
