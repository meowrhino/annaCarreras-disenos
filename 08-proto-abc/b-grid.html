<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anna Carreras — grid (prototipo B)</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="base.css">
<style>
  /* PROTOTIPO B — parrilla con filtro por formato.
     De monicarikic.com: Work / About / Contact y nada más, cada pieza con una
     frase. Con 103 proyectos el filtro deja de ser un adorno: es la única
     manera de que la parrilla sea navegable. Las portadas son casi todas 16:9
     (93 de 103), así que la retícula sale limpia sin recortar nada. */
  :root {
    --bg: #fafaf8; --fg: #14140f; --dim: #86867e; --rule: #e0e0d8; --accent: #1b4de4;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111110; --fg: #f0f0ea; --dim: #7a7a72; --rule: #262624; --accent: #7f9bff; }
  }
  header.site { padding: 3.5rem 1.5rem 0; max-width: 90rem; margin: 0 auto; }
  header.site h1 { margin: 0; font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 500; letter-spacing: -.02em; }
  header.site .tag { display: block; margin-top: .4rem; font: 400 .82rem/1.4 var(--mono); color: var(--dim); }
  header.site nav { margin-top: 1.5rem; display: flex; gap: 1.25rem; font: 500 .72rem/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; }
  header.site nav a[aria-current], header.site nav a:hover { color: var(--accent); }

  .filters {
    max-width: 90rem; margin: 2.5rem auto 0; padding: 0 1.5rem;
    display: flex; flex-wrap: wrap; gap: .4rem; align-items: center;
  }
  .filters button {
    font: 400 .74rem/1 var(--mono); letter-spacing: .02em;
    color: var(--dim); background: none; border: 1px solid var(--rule);
    padding: .45rem .6rem; border-radius: 99px; cursor: pointer;
  }
  .filters button:hover { color: var(--fg); }
  .filters button[aria-pressed="true"] { color: var(--bg); background: var(--fg); border-color: var(--fg); }
  .filters .count { margin-left: auto; font: 400 .74rem/1 var(--mono); color: var(--dim); }

  .grid {
    list-style: none; max-width: 90rem; margin: 2rem auto 0; padding: 0 1.5rem 8rem;
    display: grid; gap: 2.5rem 1.5rem; grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr));
  }
  .grid img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: var(--rule); }
  .grid a { display: block; }
  .grid a:hover img { opacity: .82; }
  .grid h2 { margin: .7rem 0 .2rem; font-size: 1rem; font-weight: 500; letter-spacing: -.01em; line-height: 1.3; }
  .grid a:hover h2 { color: var(--accent); }
  .grid .meta { font: 400 .72rem/1.5 var(--mono); color: var(--dim); letter-spacing: .02em; }
  .grid .sum { margin: .35rem 0 0; font-size: .82rem; line-height: 1.45; color: var(--dim); }
  .grid .sum:empty::before { content: "—"; }
</style>
</head>
<body>

<header class="site" data-nav>
  <h1>Anna Carreras</h1>
  <span class="tag">generative art &amp;&amp; interactive installations</span>
  <nav>
    <a href="#/">Work</a>
    <a href="#/about">About</a>
  </nav>
</header>

<main id="app"></main>

<nav class="protobar">
  <a href="a-index.html">A · índice</a>
  <a href="b-grid.html" aria-current="page">B · grid</a>
  <a href="c-canvas.html">C · canvas</a>
  <a href="index.html">prototipos</a>
</nav>

<script type="module">
import { el, router } from './proto.js';

const app = document.getElementById('app');
let active = null;   // null = todos

function renderList(index) {
  document.title = 'Anna Carreras — work';
  const counts = new Map();
  index.forEach((p) => p.categories.forEach((c) => counts.set(c, (counts.get(c) || 0) + 1)));
  const shown = active ? index.filter((p) => p.categories.includes(active)) : index;

  const bar = el('div');
  bar.className = 'filters';
  const chip = (label, value, n) => {
    const b = el('button', label + ' <span style="opacity:.55">' + n + '</span>');
    b.setAttribute('aria-pressed', String(active === value));
    b.onclick = () => { active = value; app.replaceChildren(renderList(index)); };
    return b;
  };
  bar.append(chip('all', null, index.length));
  [...counts].sort((a, b) => b[1] - a[1]).forEach(([c, n]) => bar.append(chip(c.replace(/_/g, ' '), c, n)));
  const count = el('span', shown.length + ' / ' + index.length);
  count.className = 'count';
  bar.append(count);

  const ul = el('ul');
  ul.className = 'grid';
  shown.forEach((p) => {
    const li = el('li');
    const a = el('a');
    a.href = (p.local ? '#/p/' : '#/x/') + p.slug;
    if (p.cover) {
      const img = new Image();
      img.src = p.cover.src;
      img.alt = '';
      img.loading = 'lazy';
      img.decoding = 'async';
      a.append(img);
    }
    a.append(el('h2', p.title));
    const m = el('div', p.year + (p.year_guessed ? '?' : '') + ' · ' + p.categories.join(' / '));
    m.className = 'meta';
    const s = el('p', p.summary || '');
    s.className = 'sum';
    a.append(m, s);
    li.append(a);
    ul.append(li);
  });

  const frag = el('div');
  frag.append(bar, ul);
  return frag;
}

router(app, renderList);
</script>
</body>
</html>
